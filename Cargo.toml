[package]
name = "halo"
version = "0.4.4"
edition = "2024"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "persistence", "wayland", "x11"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
log = "0.4"
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
window-vibrancy = "0.8"
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(windows)'.dependencies]
# No Windows também há o renderizador wgpu (DirectX / software) como plano B.
eframe = { version = "0.37", default-features = false, features = ["wgpu"] }
windows = { version = "0.62", features = ["Media_Control", "Foundation"] }
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_Media_Audio", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
# Só é usado quando o alvo é Windows (ícone e versão do .exe).
winresource = { version = "0.1", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dev-dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
