name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: halo.exe
            asset: halo-windows-x64.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: halo
            asset: halo-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: halo
            asset: halo-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: halo
            asset: halo-macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libssl-dev pkg-config
      - run: cargo test --release --target ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Renomeia binário
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.asset }}

      # A versão vem do Cargo.toml e as notas, da seção dela no CHANGELOG.md.
      - name: Lê a versão e as novidades
        id: version
        shell: bash
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          awk -v v="$ver" '$0 == "## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          cat notes.md

      - name: Instalador do Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DVersion=${{ steps.version.outputs.ver }} "/DSource=..\${{ matrix.asset }}" installer\halo.iss

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            dist/*

      # Cada push na main publica/atualiza a release "vX.Y.Z".
      - name: Publica release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Halo ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          body_path: notes.md
          files: |
            ${{ matrix.asset }}
            dist/*
